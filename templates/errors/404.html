{% extends "base.html" %}
{% block title %}404 — Resource Not Found{% endblock %}
{% block content %}
<div class="consent-wrapper" style="text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--color-cyan);">404</h1>
    <h2 style="font-size: 1.25rem; margin: 0.5rem 0 1rem;">Resource Not Found</h2>
    <p style="color: var(--text-secondary); max-width: 480px; margin: 0 auto 1.5rem;">
      The requested endpoint or document does not exist on this server.
    </p>
    <a href="{{ url_for('public.index') }}" class="btn btn-outline">&larr; Return to Home</a>
  </div>
</div>
{% endblock %}
