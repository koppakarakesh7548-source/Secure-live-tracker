{% extends "base.html" %}
{% block title %}500 — System Error{% endblock %}
{% block content %}
<div class="consent-wrapper" style="text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--color-rose);">500</h1>
    <h2 style="font-size: 1.25rem; margin: 0.5rem 0 1rem;">System Error Encountered</h2>
    <p style="color: var(--text-secondary); max-width: 480px; margin: 0 auto 1.5rem;">
      An unexpected internal error occurred. For security reasons, diagnostic stack traces are withheld from public view.
    </p>
    <a href="{{ url_for('public.index') }}" class="btn btn-outline">&larr; Return to Home</a>
  </div>
</div>
{% endblock %}
