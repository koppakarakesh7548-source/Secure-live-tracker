version: "3.8"

services:
  web:
    build: .
    container_name: secure-live-tracker
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=generate-a-strong-random-secret-for-production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=ChangeMeNowSecure123!
      - SESSION_COOKIE_SECURE=False
    volumes:
      - db_data:/app/database
    restart: unless-stopped

volumes:
  db_data:
